# This workflow will build, test, sign and pack the release branches for EPPlus.
# It will also generate and publish an SBOM per target framework.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Release Branches

on:
  push:
    branches: [ "release/**" ]
  pull_request:
    branches: [ "release/**" ]

jobs:
  build:

    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # --- Read version and target frameworks from Directory.Build.props ---
    # Both Version and the shared target framework list are centralized in
    # src/Directory.Build.props (shared by EPPlus and the five embedded sub-projects:
    # DrawingRenderer, Export.Pdf, Fonts.OpenType, Graphics). EPPlus.csproj no longer
    # holds a literal TFM list; it consumes $(EPPlusCoreTargetFrameworks), which a raw
    # XML parser cannot expand. Therefore both values are read directly from props.
    - name: Read version and target frameworks
      id: read_version
      run: |
        $propsXml = [xml](Get-Content ./src/Directory.Build.props)
        $version = $propsXml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($version)) {
          Write-Error "Failed to read Version from src/Directory.Build.props. Aborting build."
          exit 1
        }

        $tfms = $propsXml.Project.PropertyGroup.EPPlusCoreTargetFrameworks | Where-Object { $_ } | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($tfms)) {
          Write-Error "Failed to read EPPlusCoreTargetFrameworks from src/Directory.Build.props. Aborting build."
          exit 1
        }

        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "TFMS=$tfms" >> $env:GITHUB_ENV
        Write-Host "Version: $version"
        Write-Host "Target frameworks: $tfms"
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore ./src/EPPlus.sln

    # Build the whole solution. Note: the EPPlus NuGet package is produced here, not by a
    # separate 'dotnet pack' step. EPPlus.csproj has GeneratePackageOnBuild=true and a custom
    # target (IncludeReferencedProjectsInPackage) that embeds the four sub-project DLLs into
    # lib/<tfm>/ inside the package. That target only runs correctly as part of a build, because
    # it depends on ReferenceCopyLocalPaths being populated; a standalone 'dotnet pack' produces
    # an incomplete package containing only EPPlus.dll. The resulting .nupkg is picked up from
    # src/EPPlus/bin/Release/ below.
    #
    # IMPORTANT: this initial .nupkg embeds UNSIGNED copies of the DLLs, because packaging
    # happens as part of this build step, before the DLLs are signed. It is deliberately
    # discarded and rebuilt below (see "Re-pack after signing") once the loose DLLs on disk
    # have been signed, so the final package embeds signed assemblies.
    - name: Build
      run: dotnet build ./src/EPPlus.sln --no-restore --configuration Release
    - name: Test
      run: dotnet test ./src/EPPlus.sln --no-build --verbosity normal --configuration Release
    - name: Install AzureSignTool
      run: dotnet tool install --global AzureSignTool --version 6.0.0
    - name: Install NuGetKeyVaultSignTool
      run: dotnet tool install --global NuGetKeyVaultSignTool

    - name: Add .NET tools to PATH
      run: echo "${{ runner.tool_cache }}/.dotnet/tools" >> $env:GITHUB_PATH
    - name: Authenticate to Azure
      uses: Azure/login@v2
      with:
        creds: '{"clientId":"${{ secrets.EPPLUS_CODE_SIGNING_APPLICATION_ID }}","clientSecret":"${{ secrets.EPPLUS_CODE_SIGNING_SECRET }}","subscriptionId":"${{ secrets.EPPLUS_CODE_SIGNING_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.EPPLUS_CODE_SIGNING_TENENT_ID }}"}'

    # --- Sign DLLs ---
    # All assemblies that ship inside a NuGet package are signed here, before the package is signed.
    # EPPlus + the five embedded sub-projects (DrawingRenderer, Export.Pdf, Fonts.OpenType,
    # Graphics, Compression) share the same target frameworks (EPPlusCoreTargetFrameworks, read into env.TFMS).
    # EPPlus.Interfaces and EPPlus.System.Drawing are separate NuGet packages (unchanged from
    # earlier versions) and are also signed here, as before.
    # NOTE: this signs the loose DLLs in each project's bin/Release/<tfm> output. The EPPlus
    # .nupkg produced by the "Build" step above was packaged BEFORE this point, so it still
    # embeds the unsigned versions of these files. The "Re-pack after signing" step below
    # regenerates that package so the embedded copies match these now-signed DLLs.
    - name: Sign assemblies with AzureSignTool
      run: |
        $projectsToSign = @(
          "EPPlus",
          "EPPlus.Interfaces",
          "EPPlus.System.Drawing",
          "EPPlus.DrawingRenderer",
          "EPPlus.Export.Pdf",
          "EPPlus.Fonts.OpenType",
          "EPPlus.Graphics",
          "EPPlus.Compression"
        )

        $tfms = "${{ env.TFMS }}" -split ";"

        foreach ($project in $projectsToSign) {
          foreach ($tfm in $tfms) {
            $tfm = $tfm.Trim()
            if ([string]::IsNullOrEmpty($tfm)) { continue }

            $dll = ".\src\$project\bin\Release\$tfm\$project.dll"
            if (-not (Test-Path $dll)) {
              Write-Host "Skipping $dll (not built for this target framework)"
              continue
            }

            Write-Host "Signing $dll"
            azuresigntool.exe sign `
              -kvu ${{ secrets.EPPLUS_CODE_SIGNING_KEY_VAULT_URL }} `
              -kvi ${{ secrets.EPPLUS_CODE_SIGNING_APPLICATION_ID }} `
              -kvt ${{ secrets.EPPLUS_CODE_SIGNING_TENENT_ID }} `
              -kvs ${{ secrets.EPPLUS_CODE_SIGNING_SECRET }} `
              -kvc ${{ secrets.EPPLUS_CODE_SIGNING_CERTIFICATE_NAME }} `
              -tr http://timestamp.globalsign.com/tsa/advanced `
              -td sha256 `
              "$dll"
          }
        }
      shell: pwsh
    # --- Sign DLLs ---

    # --- Patch signed DLLs into the already-built packages ---
    # The EPPlus .nupkg produced by the "Build" step embeds the DLLs as they were AT BUILD TIME,
    # i.e. unsigned, since GeneratePackageOnBuild runs before this workflow's signing step.
    # 'dotnet pack --no-build' cannot fix this: the custom IncludeReferencedProjectsInPackage
    # target (which embeds the sub-project DLLs) depends on ReferenceCopyLocalPaths, which is
    # only populated when the Build target actually runs - so a --no-build pack silently drops
    # the embedded sub-project DLLs and produces a package containing only EPPlus.dll. Running a
    # full 'dotnet pack' (without --no-build) avoids that, but risks the opposite problem:
    # MSBuild's incremental build can re-copy the (still unsigned) obj/ output over the signed
    # bin/ DLL, undoing the signature.
    #
    # Instead, we leave the .nupkg files exactly as produced by "Build" and directly patch them:
    # open each package as a zip archive and replace every lib/<tfm>/*.dll entry with the bytes
    # of the matching, already-signed DLL from that project's bin/Release/<tfm> folder. This
    # touches only the package archive, never triggers a rebuild, and cannot regress the signature.
    - name: Patch signed DLLs into packages
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem

        $packageProjects = @(
          "EPPlus",
          "EPPlus.Interfaces",
          "EPPlus.System.Drawing"
        )

        foreach ($project in $packageProjects) {
          $pkgDir = ".\src\$project\bin\Release"
          $pkgs = Get-ChildItem -Path $pkgDir -Filter "*.nupkg" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "\.symbols\.nupkg$" }

          foreach ($pkg in $pkgs) {
            Write-Host "Patching signed DLLs into $($pkg.Name)"
            $zip = [System.IO.Compression.ZipFile]::Open($pkg.FullName, 'Update')
            try {
              $dllEntries = $zip.Entries | Where-Object { $_.FullName -match '^lib/[^/]+/.+\.dll$' }
              foreach ($entry in $dllEntries) {
                $parts = $entry.FullName -split '/'
                $tfm = $parts[1]
                $dllName = $parts[-1]
                $projectName = [System.IO.Path]::GetFileNameWithoutExtension($dllName)
                $signedDll = ".\src\$projectName\bin\Release\$tfm\$dllName"

                if (-not (Test-Path $signedDll)) {
                  Write-Host "  Skipping $($entry.FullName) (no signed source found at $signedDll)"
                  continue
                }

                $entryPath = $entry.FullName
                $entry.Delete()
                $newEntry = $zip.CreateEntry($entryPath)
                $newStream = $newEntry.Open()
                $bytes = [System.IO.File]::ReadAllBytes($signedDll)
                $newStream.Write($bytes, 0, $bytes.Length)
                $newStream.Close()
                Write-Host "  Replaced $entryPath with signed $signedDll"
              }
            }
            finally {
              $zip.Dispose()
            }
          }
        }
      shell: pwsh
    # --- Patch signed DLLs into packages ---

    # --- Collect the built packages ---
    # The packages are produced by the pack step above (GeneratePackageOnBuild / re-pack), not
    # by a fresh 'dotnet pack' with no prior context. We copy the three packages we actually ship
    # (EPPlus, EPPlus.Interfaces, EPPlus.System.Drawing) into ./output for signing and upload.
    # The four sub-projects and the benchmark project have IsPackable=false and therefore
    # produce no package of their own; the sub-project DLLs ship embedded inside the EPPlus package.
    - name: Collect NuGet packages
      run: |
        New-Item -ItemType Directory -Force -Path ./output | Out-Null

        $packageProjects = @(
          "EPPlus",
          "EPPlus.Interfaces",
          "EPPlus.System.Drawing"
        )

        $found = $false
        foreach ($project in $packageProjects) {
          $pkgDir = ".\src\$project\bin\Release"
          $pkgs = Get-ChildItem -Path $pkgDir -Filter "*.nupkg" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "\.symbols\.nupkg$" }

          if ($null -eq $pkgs -or $pkgs.Count -eq 0) {
            Write-Error "No .nupkg found for $project in $pkgDir. Expected GeneratePackageOnBuild to produce one."
            exit 1
          }

          foreach ($pkg in $pkgs) {
            Write-Host "Collecting $($pkg.Name) from $pkgDir"
            Copy-Item $pkg.FullName -Destination ./output -Force
            $found = $true
          }
        }

        if (-not $found) {
          Write-Error "No packages were collected. Aborting."
          exit 1
        }
      shell: pwsh
    # --- Collect the built packages ---

    - name: Sign NuGet packages
      run: |
        NuGetKeyVaultSignTool.exe sign -kvu ${{ secrets.EPPLUS_CODE_SIGNING_KEY_VAULT_URL }} -kvc ${{ secrets.EPPLUS_CODE_SIGNING_CERTIFICATE_NAME }} -kvi ${{ secrets.EPPLUS_CODE_SIGNING_APPLICATION_ID }} -kvs ${{ secrets.EPPLUS_CODE_SIGNING_SECRET }} -kvt ${{ secrets.EPPLUS_CODE_SIGNING_TENENT_ID }} -tr http://timestamp.globalsign.com/tsa/advanced -fd sha256 -td sha256 -own EPPlusSoftware ".\output\*.nupkg"

    # --- Verify the EPPlus package contains the embedded assemblies, correctly signed ---
    # Automates the manual check that the four sub-projects are present in the final EPPlus
    # package and signed with the same certificate as EPPlus.dll. This is the primary safety net:
    # because packaging depends on build behaviour, this step must fail the build if the package
    # is ever produced without all six embedded assemblies.
    - name: Verify EPPlus package contents and signatures
      run: |
        $nupkg = Get-ChildItem ./output/*.nupkg |
          Where-Object { $_.Name -notmatch "EPPlus\.Interfaces" -and $_.Name -notmatch "EPPlus\.System\.Drawing" } |
          Where-Object { $_.Name -notmatch "\.symbols\.nupkg$" } |
          Select-Object -First 1

        if ($null -eq $nupkg) {
          Write-Error "Could not locate the main EPPlus .nupkg in ./output."
          exit 1
        }
        Write-Host "Verifying package: $($nupkg.Name)"

        $extractPath = "./nupkg-verify"
        if (Test-Path $extractPath) { Remove-Item $extractPath -Recurse -Force }
        Expand-Archive -Path $nupkg.FullName -DestinationPath $extractPath -Force

        # The six assemblies that must ship inside the EPPlus package.
        $expectedDlls = @(
          "EPPlus.dll",
          "EPPlus.DrawingRenderer.dll",
          "EPPlus.Export.Pdf.dll",
          "EPPlus.Fonts.OpenType.dll",
          "EPPlus.Graphics.dll",
          "EPPlus.Compression.dll"
        )

        $hasError = $false
        foreach ($dllName in $expectedDlls) {
          $found = Get-ChildItem -Path $extractPath -Recurse -Filter $dllName
          if ($found.Count -eq 0) {
            Write-Host "ERROR: $dllName not found anywhere in the package."
            $hasError = $true
            continue
          }

          foreach ($file in $found) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") {
              Write-Host "ERROR: $($file.FullName) is not validly signed (status: $($signature.Status))."
              $hasError = $true
            } else {
              Write-Host "OK: $($file.FullName) present and validly signed."
            }
          }
        }

        if ($hasError) {
          Write-Error "Package verification failed. See errors above."
          exit 1
        }
        Write-Host "All embedded assemblies are present and validly signed."
      shell: pwsh
    # --- Verify package contents ---

    - name: Upload NuGet packages as artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-nuget-packages
        path: ./output/*.nupkg

    # --- SBOM (after build to avoid CycloneDX overwriting project.assets.json) ---
    - name: Install CycloneDX
      run: dotnet tool install --global CycloneDX
    - name: Generate combined SBOM
      run: dotnet CycloneDX ./src/EPPlus/EPPlus.csproj -o ./sbom -F Json -st Library -sv ${{ env.VERSION }} -fn epplus-${{ env.VERSION }}.sbom.json -imp ./src/EPPlus/sbom-metadata-template.xml --spec-version 1.6
    - name: Generate per-TFM SBOMs
      run: |
        $tfms = "${{ env.TFMS }}" -split ";"
        foreach ($tfm in $tfms) {
          $tfm = $tfm.Trim()
          if ([string]::IsNullOrEmpty($tfm)) { continue }
          Write-Host "Generating SBOM for $tfm"
          dotnet CycloneDX ./src/EPPlus/EPPlus.csproj -o ./sbom -F Json -st Library -sv ${{ env.VERSION }} -fn "epplus-${{ env.VERSION }}.$tfm.sbom.json" -imp ./src/EPPlus/sbom-metadata-template.xml --framework $tfm --spec-version 1.6
        }
      shell: pwsh
    - name: Generate SHA-256 checksums for all SBOMs
      run: |
        Get-ChildItem -Path "./sbom" -Filter "*.sbom.json" | ForEach-Object {
          $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding utf8NoBOM
          Write-Host "Checksum generated for $($_.Name): $hash"
        }
      shell: pwsh
    - name: Upload all SBOMs to Azure Blob Storage
      run: |
        Get-ChildItem -Path "./sbom" | ForEach-Object {
          Write-Host "Uploading $($_.Name)"
          az storage blob upload `
            --account-name eppluswebprod `
            --container-name sbom `
            --name $_.Name `
            --file $_.FullName `
            --auth-mode login `
            --overwrite
        }
      shell: pwsh