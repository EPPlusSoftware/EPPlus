  assemblies:
  - EPPlus
  namespace: OfficeOpenXml.Data.Connection
  summary: >-
    Adds a connection of type database with the specified connection string. 

    EPPlus will set the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of the connection to Odbc or OleDb, depending on the connection string. If you use another type, please set it manually.

    If the connection string is a power querty connection string, please also see <xref href="OfficeOpenXml.ExcelWorkbook.PowerQuerySettings" data-throw-if-not-resolved="false"></xref>
  example: []
  syntax:
    content: public ExcelConnection AddDatabase(string name, string connectionString)
    parameters:
    - id: name
      type: System.String
      description: The name of the connection.
    - id: connectionString
      type: System.String
      description: The connection string to the database.
    return:
      type: OfficeOpenXml.Data.Connection.ExcelConnection
      description: The connection
    content.vb: Public Function AddDatabase(name As String, connectionString As String) As ExcelConnection
