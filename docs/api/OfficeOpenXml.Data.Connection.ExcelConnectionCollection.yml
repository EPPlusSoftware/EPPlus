  name.vb: AddDatabase(String, String)
- uid: OfficeOpenXml.Data.Connection.ExcelConnectionCollection.AddPowerQuery(System.String,System.String,System.String)
  commentId: M:OfficeOpenXml.Data.Connection.ExcelConnectionCollection.AddPowerQuery(System.String,System.String,System.String)
  id: AddPowerQuery(System.String,System.String,System.String)
  parent: OfficeOpenXml.Data.Connection.ExcelConnectionCollection
