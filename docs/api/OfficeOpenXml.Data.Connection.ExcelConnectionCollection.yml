      path: src/EPPlus/Data/Connection/ExcelConnectionCollection.cs
      branch: develop8
      repo: https://github.com/EPPlusSoftware/EPPlus.git
    id: AddPowerQuery
    path: ../src/EPPlus/Data/Connection/ExcelConnectionCollection.cs
    startLine: 140
  assemblies:
  - EPPlus
  namespace: OfficeOpenXml.Data.Connection
  summary: >-
    Adds a power query connection with the specified connection string. 

    EPPlus will set the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of the connection to OleDb.

    A power query connection requires a connection string with the OleDb provide Microsoft.Mashup.OleDb.1 and a M-Formula containing the query.

    The <xref href="OfficeOpenXml.ExcelWorkbook.PowerQuerySettings" data-throw-if-not-resolved="false"></xref> property will be created, if it does not exist.
  example: []
  syntax:
    content: public ExcelConnection AddPowerQuery(string name, string connectionString, string mFormula)
    parameters:
    - id: name
      type: System.String
      description: The name of the connection.
    - id: connectionString
      type: System.String
      description: 'The connection string to the database. Power query connection string usually uses the Microsoft.Mashup.OleDb.1 OleDb provider. For example: Provider=Microsoft.Mashup.OleDb.1;Data Source=$Workbook$;Location="Table 1";Extended Properties=""'
    - id: mFormula
      type: System.String
      description: The M formulas to use for the power query connection, without the Section1 declaration. This formula is appended to the Formulas property of the <xref href="OfficeOpenXml.ExcelWorkbook.PowerQuerySettings" data-throw-if-not-resolved="false"></xref> object.
    return:
      type: OfficeOpenXml.Data.Connection.ExcelConnection
      description: The connection
    content.vb: Public Function AddPowerQuery(name As String, connectionString As String, mFormula As String) As ExcelConnection
  overload: OfficeOpenXml.Data.Connection.ExcelConnectionCollection.AddPowerQuery*
  nameWithType.vb: ExcelConnectionCollection.AddPowerQuery(String, String, String)
  fullName.vb: OfficeOpenXml.Data.Connection.ExcelConnectionCollection.AddPowerQuery(String, String, String)
  name.vb: AddPowerQuery(String, String, String)
