  commentId: M:OfficeOpenXml.Data.Connection.ExcelPowerQuerySettings.Create
  id: Create
  parent: OfficeOpenXml.Data.Connection.ExcelPowerQuerySettings
  langs:
  - csharp
  - vb
  name: Create()
  nameWithType: ExcelPowerQuerySettings.Create()
  fullName: OfficeOpenXml.Data.Connection.ExcelPowerQuerySettings.Create()
  type: Method
  source:
    remote:
      path: src/EPPlus/Data/PowerQuery/ExcelPowerQuerySettings.cs
      branch: develop8
      repo: https://github.com/EPPlusSoftware/EPPlus.git
    id: Create
    path: ../src/EPPlus/Data/PowerQuery/ExcelPowerQuerySettings.cs
    startLine: 357
  assemblies:
  - EPPlus
  namespace: OfficeOpenXml.Data.Connection
  summary: >-
    Create the DataMashup xml used for power query setting in the CustomXml. 

    This will initialize the PermissionsXml, MetadataXml and Formulas properties with empty settings.

    This enables the possibility to add power query connections to the workbook (provider=Microsoft.Mashup.OleDb.1). 

    Power query connections requires the M formula to be set in the <xref href="OfficeOpenXml.Data.Connection.ExcelPowerQuerySettings.Formulas" data-throw-if-not-resolved="false"></xref> under Section1 and meta data to be created in the <xref href="OfficeOpenXml.Data.Connection.ExcelPowerQuerySettings.MetadataXml" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void Create()
    content.vb: Public Sub Create()
  overload: OfficeOpenXml.Data.Connection.ExcelPowerQuerySettings.Create*
