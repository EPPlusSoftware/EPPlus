  assemblies:
  - EPPlus
  namespace: OfficeOpenXml.Data.Connection
  summary: >-
    <p>The plain-text document that contains the Power Query Formula for each query in the spreadsheet.</p>

    <p>It is fully specified by <a href="https://learn.microsoft.com/en-us/powerquery-m/power-query-m-language-specification">[MSDOCS - MLANG]</a> except for the following special rules:</p>

    <ul><li>Only a single section is allowed and MUST be named “Section1”.</li><li>Section member names MUST NOT contain periods, double quotes, tabs, leading/trailing whitespace, or line/carriage returns.Also, they MUST NOT be blank or consist only of whitespace</li><li>All section members SHOULD be shared.</li></ul>
  example: []
  syntax:
    content: public string Formulas { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property Formulas As String
