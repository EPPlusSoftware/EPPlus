  namespace: OfficeOpenXml
  summary: "\nA percentage of the widest text. Since charaters in different fonts have different widths we use this threshold remove characters from the longer string for comparing to the current text.\nThis is so we can skip obvious shorter strings and save time on calculating it&apos;s actual width.\n"
  example: []
